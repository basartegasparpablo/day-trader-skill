# ---------------------------------------------------------------------------
# Trading system configuration.
# Safety first: mode stays "paper" until the go-live checklist in README.md
# is complete. Live mode ALSO requires env TRADER_I_UNDERSTAND_LIVE_RISK=yes.
# ---------------------------------------------------------------------------
mode: paper                 # paper | live

# Which strategy the bot trades. Pick it with `python -m trader compare`.
strategy: momentum_rotation # trend_pullback | momentum_rotation | opening_range_breakout | none (DCA only)

# Liquid ETFs only: diversified, cheap to trade, no single-company blowups.
universe: [SPY, QQQ, IWM, DIA, EFA, EEM, XLK, XLF, XLV, XLE, XLI, XLY, XLP, XLU, TLT, IEF, GLD]
benchmark: SPY

risk:
  risk_per_trade: 0.01      # lose at most 1% of equity if a stop is hit
  max_position_pct: 0.34    # no single position above 34% of equity
  max_positions: 3
  daily_loss_limit: 0.02    # down 2% vs yesterday's close -> flatten, no new trades today
  max_drawdown_halt: 0.15   # down 15% from the equity peak -> flatten and halt until a human resumes
  max_order_value: 5000     # live sanity cap per order (USD); raise deliberately as the account grows

costs:
  slippage_bps: 5           # 0.05% per fill, each side
  commission_per_order: 0.0 # Alpaca stock/ETF trades are commission-free

backtest:
  capital: 10000
  start: "2008-01-01"       # includes 2008, 2020 and 2022 drawdowns on purpose
  oos_split: 0.6            # first 60% in-sample, last 40% out-of-sample

data:
  source: yahoo             # yahoo | alpaca | csv | synthetic
  csv_dir: data/csv         # for source=csv: one <SYMBOL>.csv per symbol (date,open,high,low,close,volume)
  alpaca_feed: iex          # iex (free) | sip (paid)

strategies:
  trend_pullback:
    sma_trend: 200
    rsi_len: 2
    rsi_entry: 10
    sma_exit: 5
    atr_len: 14
    atr_stop: 2.5
  momentum_rotation:
    lookback: 126           # ~6 months
    top_n: 3
    sma_trend: 200
  opening_range_breakout:
    range_minutes: 30
    last_entry: "14:00"
    universe: [SPY, QQQ, IWM]

# ---------------------------------------------------------------------------
# Monthly index investing (the slow core). Buys a fixed dollar amount every
# month regardless of news or market moves, and never sells.
# Best practice: give it its own Alpaca account via env ALPACA_DCA_API_KEY_ID /
# ALPACA_DCA_API_SECRET_KEY. Otherwise it shares the main account and the
# trading bot treats these symbols as untouchable core holdings.
# ---------------------------------------------------------------------------
dca:
  enabled: true
  monthly_amount: 500       # USD per month; set to what you can invest without needing it back
  allocations:              # must sum to 1.0
    VTI: 1.0                # total US stock market; e.g. {VTI: 0.6, VXUS: 0.3, BND: 0.1} to diversify

# ---------------------------------------------------------------------------
# Company news
# ---------------------------------------------------------------------------
news:
  source: alpaca            # alpaca (history since 2015, needs keys) | yahoo (last few days only)
  scorer: lexicon           # lexicon (free) | claude (needs ANTHROPIC_API_KEY, costs money)
  # Companies to study and to show in the daily news brief
  watchlist: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, JPM, LLY, V, XOM, UNH, COST, NFLX]
  study_threshold: 0.2      # |tone| >= this counts as positive/negative news
  filter:                   # live trading: don't BUY a symbol with bad recent news
    enabled: false          # turn on only if `news-study` shows negative news keeps hurting afterwards
    lookback_hours: 24
    block_below: -0.3
    min_articles: 1
